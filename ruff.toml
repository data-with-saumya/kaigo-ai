line-length = 120
target-version = "py312"
extend-exclude = ["backend/.venv"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # long strings in user-facing copy; FastAPI Depends() defaults

[lint.isort]
known-first-party = ["agents", "api", "models", "rules", "services", "config", "main"]

[lint.per-file-ignores]
# HTTP error mapping: the original exception is logged by the handler; chaining adds nothing for clients.
"backend/api/*.py" = ["B904"]
"backend/api/deps.py" = ["B904"]
"scripts/evaluate.py" = ["E402", "E731"]
